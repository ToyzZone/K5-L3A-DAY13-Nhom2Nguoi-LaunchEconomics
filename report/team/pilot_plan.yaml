    spillover_risk: "Chia sẻ câu trả lời trong depot; giảm bằng quyền theo tài khoản và log lượt mở theo staff_id"
    predeclared: "Chỉ số chính, ngưỡng, luật dừng và ngày quyết định chốt trước ngày bắt đầu"
  stop_rules:
    - "NẾU có >= 1 ca hoàn trùng (đối soát sổ cái mỗi giờ: cùng request_id có 2 refund_ledger_write ok) TRONG bất kỳ giờ nào của pilot THÌ Giám đốc vận hành tắt trợ lý trong 30 phút từ lúc phát hiện, Kỹ sư trưởng agent thu hồi khoản hoàn thừa trong 24 giờ KHÔNG THÌ không được bật lại trước khi kiểm thử khoá chống trùng đạt"
    - "NẾU mở lại 7 ngày của nhóm trợ lý (chỉ yêu cầu đủ 7 ngày theo dõi) vượt 6%, hoặc cao hơn đối chứng >= 3,6 điểm ở bước 4 người, >= 2,2 điểm ở bước 10 người, >= 2 điểm ở bước 20 người TRONG 7 ngày cộng dồn THÌ Giám đốc vận hành tắt trợ lý trong 30 phút; chênh >= 2 điểm ở bước 4 hoặc 10 người thì PM trợ lý hoàn phí đọc toàn bộ trace mở lại trong 2 ngày KHÔNG THÌ không được sang bước rollout tiếp"
    - "NẾU chi phí mỗi việc thành công > 8.000 đ [simulated] TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"
