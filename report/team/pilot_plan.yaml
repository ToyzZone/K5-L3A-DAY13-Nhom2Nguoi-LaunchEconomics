# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Số lấy từ src/lab13.py (hàm nhiem_vu_D) và bảng A3 trong bang_chi_phi.md.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74×0,02 = 2,48; n = 1.251×2,48 = 3.103 mỗi nhóm
#      -> 42 người mỗi nhóm, tổng 84 > 40: KHÔNG đủ người.
#   c) 20 nhân viên mỗi nhóm: tối đa c/ICC = 20/0,02 = 1.000 < 1.251: KHÔNG đạt.
#   d) 6 depot mỗi nhóm: tối đa 6/0,02 = 300.
#   e) Mức chênh 6 điểm: 859 mỗi nhóm; 20 người mỗi nhóm cần m >= 299 yêu cầu/người (DE 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" (chọn chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm bằng code, seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận: với 40 nhân viên không cách chia cụm nào đủ mẫu cho mức chênh 5 điểm,
#   nên chọn mức chênh 6 điểm (859 mỗi nhóm). Nếu tác động thật chỉ 5 điểm thì power còn ~0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại: toàn mẫu 4,25%, phạm vi noi_dia+hang_nang 3,97%.
#   Không đặt trần tuyệt đối 3% (pilot sẽ bị dừng ngay tuần đầu); dùng so với đối chứng +2 điểm kèm trần 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (0,22×) và hang_nang (0,69× so với 12.000 đ, simulated); loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, có điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên mỗi nhóm; bước 0,10 và 0,25 mỗi bước 1 tuần; bước 0,50 ít nhất 10 ngày vì m >= 299 yêu cầu/người, mỗi người ~31 yêu cầu trong phạm vi/ngày (1.500 ÷ 40 × 982/1.200)
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận (5 điểm không đủ mẫu với 40 người)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng chạy cùng tuần, cùng depot"
    spillover_risk: "Chia sẻ câu trả lời trong depot; giảm bằng quyền theo tài khoản và log lượt mở theo staff_id"
    predeclared: "Chỉ số chính, ngưỡng, luật dừng và ngày quyết định chốt trước ngày bắt đầu"
  stop_rules:
    - "NẾU mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng >= 2 điểm hoặc vượt 6%, hoặc có >= 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp"
    - "NẾU chi phí mỗi việc thành công > 8.000 đ [simulated] TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"
  simulated_inputs: ["chi phí mỗi việc thành công 4.472 đ và các tỉ số A3 (0,22×/0,69×/1,88×/0,85×)", "phut_xem_lai_simulated", "phut_lam_lai_simulated", "mo_lai_trong_7_ngay 4,25% / 3,97%"]
